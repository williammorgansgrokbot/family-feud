*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1e120a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{font-family:LIL,'Arial Black',Arial,sans-serif;color:#2a1a0e}
#stage{position:absolute;left:0;top:0;width:640px;height:296px;transform-origin:0 0;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:640px;height:296px}
.avf{position:absolute;left:0;top:0;pointer-events:none;z-index:30;transform-origin:50% 100%;will-change:transform,opacity}.nslot{position:relative}.avi{position:absolute;left:3px;top:2px;width:18px;height:18px;border-radius:50%;pointer-events:none;z-index:2}.nslot.hasav select.nsel{padding-left:24px}.lav{width:16px;height:16px;border-radius:50%;vertical-align:middle;margin-right:4px}
.dwho{position:relative;flex:2.2;margin:0 6px;min-width:0}#dress .arw{flex:0 0 72px!important}.dwho select{height:38px;border-radius:19px;text-align:center;text-align-last:center;font-size:13px;padding:0 26px;background:#fff4d6;border:2px solid #1e120a;box-shadow:inset 0 -3px 0 #e0c48a;cursor:pointer}.dwho .car{position:absolute;right:11px;top:50%;margin-top:-8px;font-size:13px;line-height:16px;color:#9a5d2e;pointer-events:none}.arw{font-size:18px!important;min-width:52px;height:38px;border-radius:19px!important;padding:0 10px!important}.dval{flex:1;text-align:center;font-family:LIL,Arial Black,sans-serif;font-size:12px;color:#6b3f1f;align-self:center}#dress .row{align-items:center}
.ov{position:absolute;font-size:10px;line-height:13px}
.hidden{display:none!important}
.panel{background:linear-gradient(#fbefcf,#efd9a4);border:3px solid #9a5d2e;border-radius:12px;box-shadow:0 0 0 2px #1e120a,inset 0 0 0 2px #3b2414,0 6px 14px rgba(0,0,0,.45);padding:8px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.panel h2{font-size:10px;color:#d83a3a;margin:2px 0 6px;font-weight:normal}
label{display:block;margin:4px 0 2px;color:#6b3f1f}
select,input{font-family:LIL,'Arial Black',Arial,sans-serif;font-size:10px;background:#fff4d6;color:#2a1a0e;border:2px solid #3b2414;border-radius:8px;padding:3px 7px;width:100%;margin:1px 0;-webkit-appearance:none;appearance:none;outline:none}
input:focus,select:focus{border-color:#d83a3a}
.btn{font-family:LIL,'Arial Black',Arial,sans-serif;font-size:10px;color:#fff4d6;text-shadow:1px 0 #1e120a,-1px 0 #1e120a,0 1px #1e120a,0 -1px #1e120a;background:#9a5d2e;border:2px solid #1e120a;border-radius:9px;box-shadow:inset 0 -3px 0 #3b2414,inset 0 2px 0 #e8b878;padding:5px 8px 7px;cursor:pointer;touch-action:manipulation}
