*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0d1630;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{font-family:LIL,'Arial Black',Arial,sans-serif;color:#13203d}
#stage{position:absolute;left:0;top:0;width:640px;height:296px;transform-origin:0 0;overflow:hidden}
#cv{position:absolute;left:0;top:0;width:640px;height:296px}
.avf{position:absolute;left:0;top:0;pointer-events:none;z-index:30;transform-origin:50% 100%;will-change:transform,opacity}.nslot{position:relative}.avi{position:absolute;left:3px;top:2px;width:18px;height:18px;border-radius:50%;pointer-events:none;z-index:2}.nslot.hasav select.nsel{padding-left:24px}.lav{width:16px;height:16px;border-radius:50%;vertical-align:middle;margin-right:4px}
.dwho{position:relative;flex:2.2;margin:0 6px;min-width:0}#dress .arw{flex:0 0 72px!important}.dwho select{height:38px;border-radius:19px;text-align:center;text-align-last:center;font-size:13px;padding:0 26px;background:#ffffff;border:2px solid #0d1630;box-shadow:inset 0 -3px 0 #c9d3e8;cursor:pointer}.dwho .car{position:absolute;right:11px;top:50%;margin-top:-8px;font-size:13px;line-height:16px;color:#2f4673;pointer-events:none}.arw{font-size:18px!important;min-width:52px;height:38px;border-radius:19px!important;padding:0 10px!important}.dval{flex:1;text-align:center;font-family:LIL,Arial Black,sans-serif;font-size:12px;color:#1b2a4a;align-self:center}#dress .row{align-items:center}
.ov{position:absolute;font-size:10px;line-height:13px}
.hidden{display:none!important}
.panel{background:linear-gradient(#ffffff,#dde3ee);border:3px solid #2f4673;border-radius:12px;box-shadow:0 0 0 2px #0d1630,inset 0 0 0 2px #1b2a4a,0 6px 14px rgba(0,0,0,.45);padding:8px;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.panel h2{font-size:10px;color:#d83a3a;margin:2px 0 6px;font-weight:normal}
label{display:block;margin:4px 0 2px;color:#1b2a4a}
select,input{font-family:LIL,'Arial Black',Arial,sans-serif;font-size:10px;background:#ffffff;color:#13203d;border:2px solid #1b2a4a;border-radius:8px;padding:3px 7px;width:100%;margin:1px 0;-webkit-appearance:none;appearance:none;outline:none}
input:focus,select:focus{border-color:#d83a3a}
.btn{font-family:LIL,'Arial Black',Arial,sans-serif;font-size:10px;color:#ffffff;text-shadow:1px 0 #0d1630,-1px 0 #0d1630,0 1px #0d1630,0 -1px #0d1630;background:#2f4673;border:2px solid #0d1630;border-radius:9px;box-shadow:inset 0 -3px 0 #1b2a4a,inset 0 2px 0 #aab6cf;padding:5px 8px 7px;cursor:pointer;touch-action:manipulation}
.btn:active{box-shadow:inset 0 -1px 0 #1b2a4a;transform:translateY(2px)}
